name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/shellcheck.yml"
      - "Makefile"
  # Always run on pull requests so the required "ShellCheck" check is reported
  # even when the diff is docs-only (path filters would otherwise skip it).
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl -fsSL -o "${archive}" "${url}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: Run ShellCheck
        run: |
          status=0
          while IFS= read -r -d '' script; do
            shellcheck -x "$script" || status=1
          done < <(find scripts tests -type f -name '*.sh' -print0)
          exit "$status"

  selftest:
    name: Portable self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run portable self-tests
        run: make test

  # GitHub-hosted macos-latest is Apple Silicon. The macos-26-arm64 image ships
  # Bash 3.2.57, so running tests with /bin/bash is the real bash 3.2 coverage.
  # This job does not install models or MLX packages. It is part of the required
  # ShellCheck gate, so a hang must not block merges for hours.
  macos-smoke:
    name: macOS Apple Silicon smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm Darwin arm64 and Bash 3.2
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          case "$(/bin/bash --version)" in
            *"version 3.2."*) ;;
            *)
              echo "expected /bin/bash 3.2.x on macOS runners" >&2
              /bin/bash --version >&2 || true
              exit 1
              ;;
          esac

      - name: Quiet Apple Silicon check
        run: scripts/detect-apple-silicon.sh --quiet

      - name: Parse detect JSON
        env:
          # Smoke does not install MLX; skip device probe for stable JSON output.
          MLX_SKIP_DEVICE_PROBE: 1
        run: |
          set -euo pipefail
          scripts/detect-apple-silicon.sh --json > "${RUNNER_TEMP}/detect.json" 2> "${RUNNER_TEMP}/detect.err"
          if [[ ! -s "${RUNNER_TEMP}/detect.json" ]]; then
            echo "detect --json produced no stdout:" >&2
            cat "${RUNNER_TEMP}/detect.err" >&2 || true
            exit 1
          fi
          python3 - "${RUNNER_TEMP}/detect.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          required = (
              "architecture",
              "apple_chip",
              "memory_bytes",
              "memory_gib",
              "memory_tier_id",
              "macos_version",
              "recommended_model",
              "workspace",
          )
          missing = [key for key in required if data.get(key) in (None, "")]
          if missing:
              raise SystemExit("detect JSON missing fields: " + ", ".join(missing))
          if data["architecture"] != "arm64":
              raise SystemExit("expected arm64, got " + str(data["architecture"]))
          if int(data["memory_bytes"]) <= 0 or int(data["memory_gib"]) <= 0:
              raise SystemExit("memory fields must be positive")
          PY

      - name: Recommend defaults
        run: |
          set -euo pipefail
          out="$(make recommend)"
          printf '%s\n' "${out}"
          grep -E -q '^recommended_model=.+' <<<"${out}"

      - name: Portable self-tests (bash 3.2)
        run: |
          set -euo pipefail
          status=0
          for t in tests/*.test.sh; do
            /bin/bash "$t" || status=1
          done
          exit "$status"

  # Protect main requires context "ShellCheck" (workflow name). GitHub Actions
  # reports job names, so this gate posts that exact check.
  required:
    name: ShellCheck
    needs: [shellcheck, selftest, macos-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, portable self-tests, and macOS smoke
        run: |
          set -euo pipefail
          test "${{ needs.shellcheck.result }}" = "success"
          test "${{ needs.selftest.result }}" = "success"
          test "${{ needs.macos-smoke.result }}" = "success"
