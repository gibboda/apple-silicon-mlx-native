name: ShellCheck

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/shellcheck.yml"
      - "Makefile"
  # Always run on pull requests so the required "ShellCheck" check is reported
  # even when the diff is docs-only (path filters would otherwise skip it).
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          status=0
          while IFS= read -r -d '' script; do
            shellcheck -x "$script" || status=1
          done < <(find scripts tests -type f -name '*.sh' -print0)
          exit "$status"

  selftest:
    name: Portable self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run portable self-tests
        run: make test

  # Protect main requires context "ShellCheck" (workflow name). GitHub Actions
  # reports job names, so this gate posts that exact check.
  required:
    name: ShellCheck
    needs: [shellcheck, selftest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and portable self-tests
        run: |
          set -euo pipefail
          test "${{ needs.shellcheck.result }}" = "success"
          test "${{ needs.selftest.result }}" = "success"
