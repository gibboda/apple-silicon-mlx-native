version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # mflux requires huggingface-hub<2.0. Allow 1.x patches; block all 2.x
      # (including pre-releases) until an mflux release declares hub 2 support.
      # This ignore also suppresses Dependabot security PRs for hub 2.x; that is
      # intentional for now.
      - dependency-name: huggingface-hub
        versions:
          - ">= 2"
