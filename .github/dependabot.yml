version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # mflux requires huggingface-hub<2.0. Allow 1.x patches; block 2.x
      # until an mflux release declares hub 2 support.
      - dependency-name: huggingface-hub
        versions:
          - ">=2.0.0a"
